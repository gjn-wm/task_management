name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite only runs against a database whose name ends in _test,
      # and creates it if missing.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/task_itms_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q -x '(\.venv|tests)' .

      - name: Frontend syntax
        run: python scripts/check_frontend.py

      - name: Tests
        run: pytest -q
